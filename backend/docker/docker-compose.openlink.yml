services:
  db:
    volumes:
      # Create the exposed OpenLink schema during a brand-new official
      # Supabase database initialization so PostgREST can pass its first
      # health check before application migrations are applied.
      - ${OPENLINK_ZOKERBASE_STACK_ROOT:-.}/volumes/db/migrations/96-openlink-schema.sql:/docker-entrypoint-initdb.d/migrations/96-openlink-schema.sql:Z
    # OpenLink server processes use this loopback-only direct connection for
    # trusted identity projection and migration checks. It is never exposed to
    # the browser or to Project VM workloads.
    ports:
      - "127.0.0.1:${OPENLINK_DB_DIRECT_PORT:-54384}:${POSTGRES_PORT}"
