allowBuilds:
  # Sharp is required by Next.js image processing during production builds.
  sharp: true
  # MSW is only used as a JavaScript test/mock library; it has no runtime
  # native artifact that OpenLink needs to execute.
  msw: false
  # Internal release engineering bundles the verified installer into a native
  # SEA executable. esbuild's install hook selects the locked host binary;
  # esbuild is never shipped as a customer runtime dependency.
  esbuild: true

overrides:
  linkify-it: 6.1.0
  postcss: 8.5.25
  sharp: 0.35.0
