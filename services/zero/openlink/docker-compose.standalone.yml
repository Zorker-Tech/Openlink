services:
  etcd:
    image: zokerbase/zero-etcd:v3.5.25
    container_name: openlink-zero-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ${OPENLINK_ZERO_ETCD_SOURCE:-./etcd}:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: zokerbase/zero-minio:RELEASE.2024-05-28T17-19-04Z
    container_name: openlink-zero-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${OPENLINK_ZERO_MINIO_SOURCE:-./minio}:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  zero:
    image: zokerbase/zero:${OPENLINK_ZERO_IMAGE_VERSION:-3.0.0}
    container_name: openlink-zero
    entrypoint: ["zero"]
    command: ["run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ZERO_MINIO_REGION: us-east-1
      ZERO_ETCD_ENDPOINTS: etcd:2379
      ZERO_MINIO_ADDRESS: minio:9000
    volumes:
      # The right-hand path is an image-internal compatibility path used by
      # the vendored engine. The host-side runtime directory is product-owned
      # and is always named `zero`.
      - ${OPENLINK_ZERO_ENGINE_SOURCE:-./zero}:/var/lib/milvus
    ports:
      - "${OPENLINK_ZERO_PORT:-19530}:19530"
      - "${OPENLINK_ZERO_HEALTH_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 30
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

networks:
  default:
    name: openlink-zero

volumes:
  zero-etcd:
  zero-minio:
  zero-engine:
